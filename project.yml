name: Ravenarr
options:
  bundleIdPrefix: com.ravenrealms
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  Ravenarr:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Ravenarr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ravenrealms.Ravenarr
        PRODUCT_NAME: Ravenarr
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: Ravenarr
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: Ravenarr/Ravenarr.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
